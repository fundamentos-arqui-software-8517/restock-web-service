# Server Configuration
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=Restock API

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:restock_db}
spring.data.mongodb.auto-index-creation=true

# Application Information for Documentation
documentation.application.description=@project.description@
# suppress inspection "SpringBootApplicationProperties"
documentation.application.version=@project.version@

# JWT Configuration Properties
# suppress inspection "SpringBootApplicationProperties"
authorization.jwt.secret=${JWT_SECRET:7k#Pz2mQxR9vLwNtYdBsUeJhCfAoGiKlMnVpXqWrTsZuDyEb4F}
# suppress inspection "SpringBootApplicationProperties"
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Cloudinary Configuration Properties
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Firebase Configuration Properties
integrations.fcm.enabled=${INTEGRATIONS_FCM_ENABLED:true}
firebase.project.id=${FIREBASE_PROJECT_ID}
firebase.credentials.base64=${FIREBASE_CREDENTIALS_BASE64}

# Resend API Configuration
resend.api.key=${RESEND_API_KEY:re_VSUnc6L1_DFz6xyiMMYHGsMgCcU7f6zxY}

# Edge Service Configuration
edge.service.url=${EDGE_SERVICE_URL:http://127.0.0.1:5000/api/v1}
edge.service.iam.url=/auth/sign-up
edge.service.device-thresholds.url=/devices/{device_id}/thresholds
edge.service.device-display-mode.url=/devices/{device_id}/display-mode

# Stripe Configuration
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:4200/subscriptions/success?session_id={CHECKOUT_SESSION_ID}}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:4200/subscriptions/cancel}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB